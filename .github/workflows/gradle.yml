name: Java Gradle Build and Test

permissions:
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gradle 9 runs only on Java 17+, so 17 is listed last and becomes JAVA_HOME. The SDK's
      # tests still run on Java 8, its floor, through the toolchain sdk-java/build.gradle selects.
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: |
            8
            17
          distribution: 'corretto'

      - name: Build and Test with Gradle
        run: ./gradlew build -PtestJavaVersion=8 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Publish Test Results
        id: test-results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always()
        with:
          check_name: "Unit Test Results :rocket:"
          comment_title: "Unit Test Results :rocket:"
          files: |
            sdk-java/build/test-results/**/*.xml

      - name: Write the CI report fragment
        if: ${{ !cancelled() && steps.test-results.outputs.json != '' }}
        env:
          TEST_RESULTS: ${{ steps.test-results.outputs.json }}
        run: |
          dir="$RUNNER_TEMP/ci-report-unit-tests"
          mkdir -p "$dir"
          jq -r '"Unit tests",
            "\(.stats.tests_succ) passed, \(.stats.tests_fail + .stats.tests_error) failed, \(.stats.tests_skip) skipped",
            if .check_url then "The [check run](\(.check_url)) lists every test and each failure." else empty end' \
            <<< "$TEST_RESULTS" > "$dir/report.md"

      - name: Upload the CI report fragment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-unit-tests
          path: ${{ runner.temp }}/ci-report-unit-tests
          if-no-files-found: ignore

