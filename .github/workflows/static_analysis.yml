name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 17 rather than the SDK's Java 8 floor: settings.gradle only includes :sdk-java-ui on Java 11+.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Report-only: the findings go to the job summary and never fail the job, only a failed analysis does.
      - name: Analyze the published modules
        run: >
          ./gradlew --no-configuration-cache --init-script .github/scripts/spotbugs.init.gradle
          -DspotbugsModules=:sdk-java,:sdk-java-ui "-DspotbugsDir=$RUNNER_TEMP/sarif"
          :sdk-java:spotbugsMain :sdk-java-ui:spotbugsMain

      - name: Summarize the findings
        run: python3 .github/scripts/sarif_summary.py SpotBugs "$RUNNER_TEMP/sarif" >> "$GITHUB_STEP_SUMMARY"
