name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # JDK 17 rather than the SDK's Java 8 floor: settings.gradle only includes :sdk-java-ui on Java 11+.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # On pull requests the base branch is analyzed too, so that only findings it lacks can fail the job.
      - name: Analyze the published modules
        run: |
          # Runs SpotBugs on the published modules that the checkout in $1 has, writing SARIF to $2.
          analyze() {
            modules=()
            for module in :sdk-java :sdk-java-ui; do
              if [ -d "$1/${module#:}" ]; then
                modules+=("$module")
              fi
            done
            (cd "$1" && ./gradlew --no-configuration-cache --init-script "$GITHUB_WORKSPACE/.github/scripts/spotbugs.init.gradle" \
              -DspotbugsModules="$(IFS=,; echo "${modules[*]}")" "-DspotbugsDir=$2" "${modules[@]/%/:spotbugsMain}")
          }
          analyze "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sarif"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The first parent of the pull request's merge commit is the base branch it merges into.
            git worktree add "$RUNNER_TEMP/base" HEAD^1
            analyze "$RUNNER_TEMP/base" "$RUNNER_TEMP/sarif-base"
          fi

      # Every finding goes to the job summary; a new one at warning or error level fails the job.
      - name: Summarize the findings
        run: |
          # The default shell has no pipefail, and without it tee would hide the summary's exit code.
          set -o pipefail
          base=()
          if [ -d "$RUNNER_TEMP/sarif-base" ]; then
            base=(--base "$RUNNER_TEMP/sarif-base" --base-root "$RUNNER_TEMP/base")
          fi
          python3 .github/scripts/sarif_summary.py SpotBugs "$RUNNER_TEMP/sarif" "${base[@]}" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/static-analysis.md"

      - name: Write the CI report fragment
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/static-analysis.md" ] || exit 0
          new=$(sed -n 's/^### New compared with the base branch: \([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/static-analysis.md")
          case "$new" in
            '') summary=$(sed -n '1s/^### //p' "$RUNNER_TEMP/static-analysis.md") ;;
            0) summary="No new findings" ;;
            1) summary="1 new finding" ;;
            *) summary="$new new findings" ;;
          esac
          mkdir -p "$RUNNER_TEMP/ci-report-static-analysis"
          {
            printf 'Static analysis\n%s\n' "$summary"
            cat "$RUNNER_TEMP/static-analysis.md"
          } > "$RUNNER_TEMP/ci-report-static-analysis/report.md"

      - name: Upload the CI report fragment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-static-analysis
          path: ${{ runner.temp }}/ci-report-static-analysis
          if-no-files-found: ignore
