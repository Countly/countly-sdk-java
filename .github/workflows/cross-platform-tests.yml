name: "Cross Platform Tests"

# The JavaFX UI module is the platform sensitive part of this repo: it drives a headless web view
# through Monocle, and that stack behaves differently per OS. JavaFX 21's WebKit segfaults when
# loading a page headlessly on macOS/aarch64, which is why those tests carry a platform gate, so the
# other platforms have to be exercised deliberately rather than assumed.
#
# The core SDK is run here too, because its storage layer builds file paths by hand and Windows is
# the only place a separator bug would show up.
on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: knowing WHICH platforms are affected is
      # the entire point of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 21 for the UI module's tests (openjfx-monocle 21 is Java 21 bytecode), 17 for everything
      # else. setup-java leaves the last listed version as JAVA_HOME, so 17 comes second.
      - name: Set up JDK 21 and 17
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            17
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # bash on both platforms so one command works everywhere; Git Bash ships on the Windows runner.
      - name: Run the core SDK tests
        shell: bash
        run: ./gradlew :sdk-java:test --console=plain

      # -Dcountly.ui.pageLoadTests=true opts the headless web view tests back in. They are skipped
      # by default only on macOS, where JavaFX 21's WebKit crashes the JVM on a real page load; this
      # job is here to find out whether Linux and Windows share that problem.
      - name: Run the JavaFX UI tests
        if: always()
        shell: bash
        run: ./gradlew :sdk-java-ui:test --console=plain -Dcountly.ui.pageLoadTests=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            sdk-java/build/reports/tests/test/
            sdk-java/build/test-results/test/
            sdk-java-ui/build/reports/tests/test/
            sdk-java-ui/build/test-results/test/
            **/hs_err_pid*.log
          if-no-files-found: warn
