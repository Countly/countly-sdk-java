name: "Cross Platform Tests"

# The JavaFX UI module is the platform sensitive part of this repo: it drives a headless web view
# through Monocle, and that stack behaves differently per OS. JavaFX 21's WebKit segfaults when
# loading a page headlessly on macOS/aarch64, which is why those tests carry a platform gate, so the
# other platforms have to be exercised deliberately rather than assumed.
#
# The core SDK is run here too, because its storage layer builds file paths by hand and Windows is
# the only place a separator bug would show up.
on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: knowing WHICH platforms are affected is
      # the entire point of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # bash on both platforms so one command works everywhere; Git Bash ships on the Windows runner.
      - name: Run the core SDK tests
        shell: bash
        run: ./gradlew :sdk-java:test --console=plain

      # The toolkit dependent classes skip themselves here and say why. They are opt-in via
      # -Dcountly.ui.pageLoadTests=true, and no environment we have can actually run them: JavaFX
      # 21's WebKit segfaults the JVM on the first real page load inside a forked Gradle test JVM,
      # confirmed with headless Monocle and with the real toolkit under xvfb on Linux, and with both
      # on macOS. What this job does cover is everything else in the module on both platforms.
      - name: Run the JavaFX UI tests
        if: always()
        shell: bash
        run: ./gradlew :sdk-java-ui:test --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            sdk-java/build/reports/tests/test/
            sdk-java/build/test-results/test/
            sdk-java-ui/build/reports/tests/test/
            sdk-java-ui/build/test-results/test/
            **/hs_err_pid*.log
          if-no-files-found: warn
