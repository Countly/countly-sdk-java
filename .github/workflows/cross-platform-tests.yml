name: "Cross Platform Tests"

# The JavaFX UI module is the platform sensitive part of this repo: it drives a headless web view
# through Monocle, and that stack behaves differently per OS. JavaFX 21's WebKit segfaults when
# loading a page headlessly on macOS/aarch64, which is why those tests carry a platform gate, so the
# other platforms have to be exercised deliberately rather than assumed.
#
# The core SDK is run here too, because its storage layer builds file paths by hand and Windows is
# the only place a separator bug would show up.
on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: knowing WHICH platforms are affected is
      # the entire point of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # bash on both platforms so one command works everywhere; Git Bash ships on the Windows runner.
      - name: Run the core SDK tests
        shell: bash
        run: ./gradlew :sdk-java:test --console=plain

      # These tests need a real JavaFX toolkit. Linux runners have no display, so xvfb provides
      # one; the Windows runner has a desktop session already. Classes still skip themselves with a
      # reason if no toolkit can start, so this never fails for the wrong reason.
      #
      # Deliberately without -Dcountly.ui.pageLoadTests: that enables the one class showing a
      # transparent stage, which segfaults the JVM everywhere it has been tried.
      #
      # testUiWithLocalCore (see sdk-java-ui/build.gradle) runs the UI on this checkout's core. The
      # release of a ui- tag still tests it against the released core it names.
      - name: Run the JavaFX UI tests
        if: always()
        shell: bash
        env:
          ORG_GRADLE_PROJECT_testUiWithLocalCore: 'true'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a ./gradlew :sdk-java-ui:test --console=plain
          else
            ./gradlew :sdk-java-ui:test --console=plain
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            sdk-java/build/reports/tests/test/
            sdk-java/build/test-results/test/
            sdk-java-ui/build/reports/tests/test/
            sdk-java-ui/build/test-results/test/
            **/hs_err_pid*.log
          if-no-files-found: warn
