version: 2
updates:
  # Gradle dependencies. org.json is declared separately in sdk-java, sdk-java-ui,
  # app-java and app-javafx; Dependabot opens one PR per module, so check that a
  # bump lands everywhere before closing the others. A bump of a published
  # dependency also has to update .github/release-contract/, or the release
  # checks fail.
  #
  # Releases are tagged on staging, so version updates target staging; master
  # receives them with the next release. Security updates still open against
  # master, so merge master into staging after taking one.
  - package-ecosystem: gradle
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    schedule:
      interval: monthly
    # CodeQL's init and analyze steps must run the same version or the analyze
    # step fails, so their updates come in one PR.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
