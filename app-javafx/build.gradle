plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    // Matches sdk-java-ui: JavaFX 21 needs Java 17.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '21.0.5'
    modules = [ 'javafx.controls', 'javafx.web' ]
}

dependencies {
    // Build directly against the SDK module so changes in sdk-java are
    // picked up without publishing or copying a jar.
    implementation project(':sdk-java')

    // The JavaFX UI artifact: feedback widget cards and the content overlay.
    implementation project(':sdk-java-ui')

    // org.json is used by the demo for pretty-printing widget data; the
    // SDK also uses it internally (and exposes JSONObject in its API).
    implementation 'org.json:json:20250517'
}

// sdk-java-ui depends on a released ly.count.sdk:java. The demo runs everything on
// the local sdk-java module instead, so two copies of the core never meet on its
// classpath.
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('ly.count.sdk:java') using project(':sdk-java')
    }
}

application {
    mainClass = 'ly.count.javafx.demo.Main'
}
