buildscript {
  repositories {
    mavenCentral()
  }
  // A widget or content link would otherwise be handed to the real system browser while tests run.
//
// No Monocle. The headless JavaFX platform cost four separate failures: Monocle 11 threw
// AbstractMethodError against JavaFX 17, Monocle 17 crashed the JVM against JavaFX 21, Monocle 21 is
// Java 21 bytecode so it needed a newer test JVM, and once that was solved JavaFX 21's WebKit
// segfaulted on every platform the moment a real page was loaded (verified on macOS, Linux and
// Windows). The tests now use the real toolkit, which is far better exercised; CI gives Linux a
// display with xvfb.
tasks.withType(Test) {
  systemProperty 'java.awt.headless', 'true'
}

dependencies {
    // Load publish plugin ONLY when publish task is requested
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("publish") }) {
      // This requires minimum java 11 to work
      classpath 'com.vanniktech:gradle-maven-publish-plugin:0.28.0'
    }
  }
}

plugins {
  id 'java-library'
  id 'org.openjfx.javafxplugin' version '0.1.0'
}

// Java 17, not 11. JavaFX only gained a public API for a transparent web view background
// (WebView.setPageFill) in version 20, and JavaFX 20+ requires Java 17. Without it the only
// lever is a com.sun.webkit internal reached by reflection, which needs --add-exports from
// every integrator and renders the empty area opaque black rather than see-through.
//
// A toolchain rather than sourceCompatibility, so this module still builds when the Gradle
// daemon itself is running on an older JDK. The core SDK stays on Java 8 regardless.
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

javafx {
  version = '21.0.5'
  modules = ['javafx.controls', 'javafx.web']
}

dependencies {
  // 'api' so a consumer of this artifact also gets the core SDK, whose types
  // appear in this package's public signatures.
  api project(':sdk-java')

  implementation 'org.json:json:20250517'

  testImplementation 'junit:junit:4.13.1'
  testImplementation 'org.mockito:mockito-core:4.11.0'
}

// Coverage. Reports land in build/reports/jacoco/test/ (HTML to read, XML for tooling).
// "./gradlew coverage" from the repo root runs this and prints a summary.
apply plugin: 'jacoco'

jacoco {
  toolVersion = JACOCO_VERSION
}

jacocoTestReport {
  dependsOn test

  reports {
    html.required = true
    xml.required = true
    csv.required = false
  }
}

if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("publish") }) {
  apply plugin: "com.vanniktech.maven.publish"
}
