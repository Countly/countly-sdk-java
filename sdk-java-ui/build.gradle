buildscript {
  repositories {
    mavenCentral()
  }
  // A widget or content link would otherwise be handed to the real system browser
// while tests run.
//
// The rest runs JavaFX headlessly through Monocle, so the display classes can be exercised
// in CI and on a developer machine without windows flashing on screen. Monocle version
// tracks the JavaFX version above.
tasks.withType(Test) {
  systemProperty 'java.awt.headless', 'true'
  systemProperty 'glass.platform', 'Monocle'
  systemProperty 'monocle.platform', 'Headless'
  systemProperty 'prism.order', 'sw'

  // Monocle has to match the JavaFX version exactly -- the 11.x build is missing methods
  // JavaFX 17's glass layer expects, and blows up as soon as a stage is shown. The matching
  // 17.x build is Java 17 bytecode, so the TEST JVM is 17 while the published artifact still
  // targets Java 11 (see the java block above). Needs a JDK 17 installed to run these tests.
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

dependencies {
    // Load publish plugin ONLY when publish task is requested
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("publish") }) {
      // This requires minimum java 11 to work
      classpath 'com.vanniktech:gradle-maven-publish-plugin:0.28.0'
    }
  }
}

plugins {
  id 'java-library'
  id 'org.openjfx.javafxplugin' version '0.1.0'
}

// JavaFX itself needs Java 11+, so this artifact has a higher floor than the
// core SDK, which stays on Java 8. Customers on Java 8 keep using the core.
java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

javafx {
  version = '17.0.20'
  modules = ['javafx.controls', 'javafx.web']
}

dependencies {
  // 'api' so a consumer of this artifact also gets the core SDK, whose types
  // appear in this package's public signatures.
  api project(':sdk-java')

  implementation 'org.json:json:20250517'

  testImplementation 'junit:junit:4.13.1'
  testImplementation 'org.testfx:openjfx-monocle:17.0.10'
  testImplementation 'org.mockito:mockito-core:4.11.0'
}

// Coverage. Reports land in build/reports/jacoco/test/ (HTML to read, XML for tooling).
// "./gradlew coverage" from the repo root runs this and prints a summary.
apply plugin: 'jacoco'

jacoco {
  toolVersion = JACOCO_VERSION
}

jacocoTestReport {
  dependsOn test

  reports {
    html.required = true
    xml.required = true
    csv.required = false
  }
}

if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("publish") }) {
  apply plugin: "com.vanniktech.maven.publish"
}
