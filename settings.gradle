pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}


include ':sdk-java', ':app-java'

// sdk-java-ui and app-javafx use the openjfx Gradle plugin which requires Java 11+.
// Skip them on older JVMs so sdk-java / app-java stay buildable on Java 8.
if (JavaVersion.current().isJava11Compatible()) {
    include ':sdk-java-ui'
    include ':app-javafx'
}
